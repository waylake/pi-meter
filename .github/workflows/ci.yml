name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: CLI smoke test
        run: node bin/pi-meter.mjs --period today --no-cache
        env:
          PI_METER_SESSION_DIR: /tmp/empty-pi-sessions
